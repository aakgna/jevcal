name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      # build before typecheck: adapter/langchain/vercel-ai/cli packages resolve
      # @jevcal/core's types from its built dist/, which only exists after build.
      - run: pnpm build
      - run: pnpm typecheck
      - run: pnpm test
