[project]
name = "jevcal"
version = "0.2.0"
description = "Typed decision schemas, backend routing, and calibration metrics (ECE, Brier, reliability diagrams) for LLM-driven structured decisions."
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
authors = [{ name = "jevcal contributors" }]
dependencies = ["pydantic>=2.0", "httpx>=0.27"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Typing :: Typed",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]
postgres = ["psycopg[binary,pool]>=3.1"]

[project.urls]
Homepage = "https://github.com/aakgna/jevcal"
Repository = "https://github.com/aakgna/jevcal"
Issues = "https://github.com/aakgna/jevcal/issues"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/jevcal"]

[tool.pytest.ini_options]
testpaths = ["tests"]
