[project]
name = "jevcal"
version = "0.2.0"
description = "Typed decision schemas, backend routing, and calibration metrics (ECE, Brier, reliability diagrams) for LLM-driven structured decisions."
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
authors = [{ name = "jevcal contributors" }]
dependencies = ["pydantic>=2.0", "httpx>=0.27"]

[project.optional-dependencies]
dev = ["pytest>=8.0"]
postgres = ["psycopg[binary,pool]>=3.1"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/jevcal"]

[tool.pytest.ini_options]
testpaths = ["tests"]
